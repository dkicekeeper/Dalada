<!DOCTYPE html>
<!-- Картинка события App Store «Первый лёд»: лёд, лунка с поплавком, палатка вдали. Без текста и
     логотипов (так просит Apple). Размер — из адреса: first_ice.html?w=1920&h=1080. Снимок делает
     appstore/events/render.mjs. Настоящее фото со льда лучше — тогда положите его вместо JPEG. -->
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; padding: 0; overflow: hidden; background: #dfeaf1; } svg { display: block; }</style>
</head>
<body>
<script>
const params = new URLSearchParams(location.search);
const W = Number(params.get("w") || 1920), H = Number(params.get("h") || 1080);
const portrait = H > W;
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const horizon = H * (portrait ? 0.36 : 0.44);
const ice = H - horizon;
const parts = [];
const add = s => parts.push(s);

add(`<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8FB8D6"/><stop offset="0.55" stop-color="#C9DFEC"/><stop offset="1" stop-color="#F3D8C2"/>
  </linearGradient>
  <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#FFF4D6"/><stop offset="0.35" stop-color="#FCE6BC" stop-opacity="0.9"/><stop offset="1" stop-color="#F7D9B8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#D3E3EC"/><stop offset="0.5" stop-color="#E7F0F5"/><stop offset="1" stop-color="#F7FAFC"/>
  </linearGradient>
  <radialGradient id="water" cx="0.45" cy="0.4" r="0.7">
    <stop offset="0" stop-color="#2C6F84"/><stop offset="0.6" stop-color="#174A5C"/><stop offset="1" stop-color="#0C2F3C"/>
  </radialGradient>
  <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#A9BFD0"/><stop offset="1" stop-color="#8EA7BA"/>
  </linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="${W * 0.004}"/></filter>
</defs>`);

// Небо и солнце у горизонта.
add(`<rect width="${W}" height="${horizon + 2}" fill="url(#sky)"/>`);
const sunR = Math.min(W, H) * 0.32;
add(`<circle cx="${W * 0.72}" cy="${horizon - sunR * 0.12}" r="${sunR}" fill="url(#sun)"/>`);
add(`<circle cx="${W * 0.72}" cy="${horizon - sunR * 0.12}" r="${sunR * 0.13}" fill="#FFF6DF"/>`);

// Дальние горы и холмы.
function ridge(base, amp, steps, fill, opacity) {
  let d = `M0 ${base}`;
  for (let i = 0; i <= steps; i++) {
    const x = (W / steps) * i;
    const y = base - amp * (0.35 + 0.65 * Math.abs(Math.sin(i * 1.7 + amp))) * (0.6 + rnd() * 0.4);
    d += ` L${x.toFixed(1)} ${y.toFixed(1)}`;
  }
  d += ` L${W} ${horizon + 2} L0 ${horizon + 2} Z`;
  add(`<path d="${d}" fill="${fill}" opacity="${opacity}"/>`);
}
ridge(horizon - H * 0.03, H * 0.12, 9, "url(#hills)", 0.75);
ridge(horizon - H * 0.005, H * 0.05, 16, "#7E98AC", 0.85);

// Берег с соснами слева.
const shoreY = horizon + 2;
add(`<path d="M0 ${shoreY - H * 0.012} Q ${W * 0.25} ${shoreY - H * 0.02} ${W * 0.48} ${shoreY} L0 ${shoreY + H * 0.008} Z" fill="#5D7C8A"/>`);
for (let i = 0; i < (portrait ? 14 : 26); i++) {
  const x = W * 0.02 + rnd() * W * 0.42;
  const h = H * (0.025 + rnd() * 0.035);
  const w = h * 0.42;
  const y = shoreY - H * 0.006;
  add(`<path d="M${x} ${y - h} L${x + w / 2} ${y} L${x - w / 2} ${y} Z" fill="${rnd() > 0.5 ? "#3E6A5F" : "#47705F"}"/>`);
}

// Лёд.
add(`<rect y="${horizon}" width="${W}" height="${ice}" fill="url(#ice)"/>`);
for (let i = 0; i < 4; i++) {
  const y = horizon + ice * (0.15 + i * 0.2);
  add(`<path d="M0 ${y} L${W} ${y - ice * 0.08} L${W} ${y - ice * 0.03} L0 ${y + ice * 0.04} Z" fill="#FFFFFF" opacity="0.22"/>`);
}
// Трещины.
for (let i = 0; i < (portrait ? 5 : 8); i++) {
  let x = rnd() * W, y = horizon + ice * (0.2 + rnd() * 0.7);
  let d = `M${x.toFixed(1)} ${y.toFixed(1)}`;
  for (let k = 0; k < 5; k++) {
    x += (rnd() - 0.3) * W * 0.06;
    y += (rnd() - 0.5) * ice * 0.04;
    d += ` L${x.toFixed(1)} ${y.toFixed(1)}`;
  }
  add(`<path d="${d}" fill="none" stroke="#B4CBD9" stroke-width="${Math.max(1, W * 0.0012)}" opacity="0.7"/>`);
}
// Сугробы у берега.
for (let i = 0; i < 6; i++) {
  const x = rnd() * W, y = horizon + ice * (0.05 + rnd() * 0.12), rx = W * (0.05 + rnd() * 0.08);
  add(`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${rx * 0.12}" fill="#FFFFFF" opacity="0.8"/>`);
}

// Палатка вдали и лунка у неё.
const tentX = W * (portrait ? 0.24 : 0.22), tentY = horizon + ice * 0.2, tentW = W * (portrait ? 0.09 : 0.05), tentH = tentW * 0.75;
add(`<ellipse cx="${tentX + tentW * 0.1}" cy="${tentY + tentH * 0.02}" rx="${tentW * 0.8}" ry="${tentH * 0.12}" fill="#9DB5C4" opacity="0.6"/>`);
add(`<path d="M${tentX - tentW / 2} ${tentY} L${tentX - tentW * 0.28} ${tentY - tentH} L${tentX + tentW * 0.28} ${tentY - tentH} L${tentX + tentW / 2} ${tentY} Z" fill="#E0763A"/>`);
add(`<path d="M${tentX} ${tentY} L${tentX - tentW * 0.12} ${tentY - tentH * 0.7} L${tentX + tentW * 0.12} ${tentY - tentH * 0.7} Z" fill="#B8552A"/>`);
add(`<ellipse cx="${tentX + tentW * 1.2}" cy="${tentY + tentH * 0.15}" rx="${tentW * 0.18}" ry="${tentW * 0.05}" fill="#1E5266"/>`);

// Лунка на переднем плане.
const hx = W * (portrait ? 0.5 : 0.58), hy = horizon + ice * (portrait ? 0.62 : 0.6);
// u — масштаб предметов; лунка меньше удочки, как в жизни.
const u = W * (portrait ? 0.2 : 0.1);
const rx = u * 0.68, ry = rx * 0.36;
add(`<ellipse cx="${hx + rx * 0.08}" cy="${hy + ry * 0.35}" rx="${rx * 1.5}" ry="${ry * 1.35}" fill="#C7D9E4" opacity="0.7" filter="url(#soft)"/>`);
add(`<ellipse cx="${hx}" cy="${hy}" rx="${rx * 1.28}" ry="${ry * 1.32}" fill="#FFFFFF"/>`);
for (let i = 0; i < 26; i++) {
  const a = rnd() * Math.PI * 2, r = 1.1 + rnd() * 0.35;
  const x = hx + Math.cos(a) * rx * r, y = hy + Math.sin(a) * ry * r * 1.05, s = rx * (0.04 + rnd() * 0.05);
  add(`<path d="M${x} ${y - s * 0.6} L${x + s} ${y} L${x + s * 0.2} ${y + s * 0.5} L${x - s * 0.8} ${y + s * 0.1} Z" fill="${rnd() > 0.5 ? "#EAF3F8" : "#D2E3EC"}"/>`);
}
add(`<ellipse cx="${hx}" cy="${hy}" rx="${rx}" ry="${ry}" fill="url(#water)"/>`);
add(`<ellipse cx="${hx}" cy="${hy - ry * 0.12}" rx="${rx * 0.98}" ry="${ry * 0.86}" fill="none" stroke="#7FB2C4" stroke-width="${rx * 0.02}" opacity="0.5"/>`);

// Поплавок и круги на воде.
const fx = hx + rx * 0.12, fy = hy + ry * 0.05, fs = rx * 0.15;
for (let i = 1; i <= 3; i++) {
  add(`<ellipse cx="${fx}" cy="${fy + fs * 0.2}" rx="${fs * (1 + i * 0.9)}" ry="${fs * (0.3 + i * 0.27)}" fill="none" stroke="#9CCBDA" stroke-width="${fs * 0.08}" opacity="${0.6 - i * 0.15}"/>`);
}
add(`<ellipse cx="${fx}" cy="${fy + fs * 0.2}" rx="${fs * 0.55}" ry="${fs * 0.35}" fill="#F4F4F2"/>`);
add(`<path d="M${fx - fs * 0.5} ${fy + fs * 0.1} Q ${fx} ${fy - fs * 1.1} ${fx + fs * 0.5} ${fy + fs * 0.1} Z" fill="#D9463B"/>`);
add(`<rect x="${fx - fs * 0.05}" y="${fy - fs * 1.35}" width="${fs * 0.1}" height="${fs * 0.75}" fill="#D9463B"/>`);

// Зимняя удочка: леска к поплавку, хлыст, ручка.
const tipX = hx + u * 0.6, tipY = hy - u * 0.5;
const handX = hx + u * (portrait ? 1.45 : 1.75), handY = hy + u * (portrait ? 0.32 : 0.4);
add(`<path d="M${tipX} ${tipY} Q ${fx + rx * 0.2} ${fy - ry} ${fx} ${fy - fs * 1.3}" fill="none" stroke="#4A4F55" stroke-width="${Math.max(1, rx * 0.008)}" opacity="0.8"/>`);
add(`<line x1="${tipX}" y1="${tipY}" x2="${handX - (handX - tipX) * 0.3}" y2="${handY - (handY - tipY) * 0.3}" stroke="#2A2F35" stroke-width="${u * 0.035}" stroke-linecap="round"/>`);
add(`<line x1="${handX - (handX - tipX) * 0.3}" y1="${handY - (handY - tipY) * 0.3}" x2="${handX}" y2="${handY}" stroke="#C99A66" stroke-width="${u * 0.09}" stroke-linecap="round"/>`);
add(`<ellipse cx="${handX - (handX - tipX) * 0.18}" cy="${handY - (handY - tipY) * 0.18}" rx="${u * 0.09}" ry="${u * 0.065}" fill="#3B4249"/>`);
add(`<ellipse cx="${(handX + hx) / 2 + u * 0.4}" cy="${handY + u * 0.12}" rx="${u * 0.9}" ry="${u * 0.06}" fill="#BCD1DE" opacity="0.6"/>`);

// Термос — зелёный, как в Dalada.
const tx = hx - u * (portrait ? 1.2 : 1.45), ty = hy + u * 0.2, tw = u * 0.2, th = u * 0.55;
add(`<ellipse cx="${tx + tw * 0.6}" cy="${ty + th * 0.02}" rx="${tw * 1.3}" ry="${tw * 0.3}" fill="#BCD1DE" opacity="0.7"/>`);
add(`<rect x="${tx - tw / 2}" y="${ty - th}" width="${tw}" height="${th}" rx="${tw * 0.25}" fill="#2E8B57"/>`);
add(`<rect x="${tx - tw * 0.42}" y="${ty - th - tw * 0.38}" width="${tw * 0.84}" height="${tw * 0.45}" rx="${tw * 0.12}" fill="#26303A"/>`);
add(`<rect x="${tx - tw * 0.28}" y="${ty - th * 0.8}" width="${tw * 0.12}" height="${th * 0.6}" rx="${tw * 0.06}" fill="#FFFFFF" opacity="0.25"/>`);

// Снежинки.
for (let i = 0; i < (portrait ? 90 : 120); i++) {
  const x = rnd() * W, y = rnd() * H, r = Math.max(1, W * (0.0008 + rnd() * 0.0022));
  add(`<circle cx="${x}" cy="${y}" r="${r}" fill="#FFFFFF" opacity="${0.35 + rnd() * 0.5}"/>`);
}

document.body.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${parts.join("")}</svg>`;
</script>
</body>
</html>
