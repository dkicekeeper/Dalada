name: iOS

# Сборка приложения и тесты пакета DaladaKit на macOS. Нужна потому, что код пишется в облачном
# контейнере на Linux, где SwiftUI не собрать: ошибки компиляции видны здесь раньше, чем в Xcode.
on:
  push:
    # Рабочие ветки тоже: сборка проверяется до попадания кода в main.
    branches: [main, "claude/**"]
    paths:
      - "ios/**"
      - "scripts/designkit_lint.sh"
      - "scripts/design-lint-baseline.json"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "scripts/designkit_lint.sh"
      - "scripts/design-lint-baseline.json"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Проверки дизайна DesignKit той версии, на которой собрано приложение (scripts/designkit_lint.sh
  # берёт её scripts/designkit_lint.py): без сырых значений вне токенов сверх
  # scripts/design-lint-baseline.json, без .swipeActions и системного Form; строки стеклянных
  # секций отступают сами и ставят разделитель под текстом (CLAUDE.md, «Компоненты интерфейса»).
  design-lint:
    name: Design lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Правила дизайна DesignKit
        run: bash scripts/designkit_lint.sh

  # macOS-раннеров у аккаунта несколько на всех (Dalada, Tenra, Platina, DesignKit). Коммит,
  # запушенный в ветку и открытый PR'ом (или запушенный и в ветку, и в main), запускает workflow
  # не один раз: собирает первый не отменённый прогон коммита, следующий пропускает сборку и
  # называет его в итоге. Ручной запуск собирает всегда; если API не ответил, прогон собирает.
  once:
    name: First run of this commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Look for an earlier run of this commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          EARLIER=""
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            EARLIER=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ios.yml/runs?head_sha=$SHA&per_page=100" \
              --jq "[.workflow_runs[] | select(.id < $GITHUB_RUN_ID and .conclusion != \"cancelled\")] | min_by(.id) | .html_url // empty") || EARLIER=""
          fi
          if [ -n "$EARLIER" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "**Build skipped:** $EARLIER builds this commit." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build app and run package tests
    needs: once
    if: needs.once.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          # Для сборки ключи Supabase не нужны — берём пример.
          cp Config/Secrets.example.xcconfig Config/Secrets.xcconfig
          xcodegen generate

      - name: Build app for iOS Simulator
        working-directory: ios
        run: |
          xcodebuild build \
            -project Dalada.xcodeproj \
            -scheme Dalada \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Run package tests
        working-directory: ios/Packages/DaladaKit
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ids = [d["udid"] for runtime, items in sorted(devices.items(), reverse=True)
                 if ".iOS-" in runtime for d in items if d["name"].startswith("iPhone")]
          print(ids[0])
          ')
          echo "Simulator: $DEVICE_ID"
          SCHEMES=$(xcodebuild -list -json | python3 -c 'import json, sys; print("\n".join(json.load(sys.stdin)["workspace"]["schemes"]))')
          echo "Schemes:"; echo "$SCHEMES"
          SCHEME=$(echo "$SCHEMES" | grep -x 'DaladaKit-Package' || echo "$SCHEMES" | grep -x 'DaladaKit' || echo "$SCHEMES" | head -1)
          echo "Testing scheme: $SCHEME"
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath build \
            -resultBundlePath "$RUNNER_TEMP/PackageTests.xcresult" \
            -quiet

      # С -quiet видно только имена упавших тестов. Здесь — тексты ошибок и причина падения процесса
      # (исключение, нет библиотеки), если тест уронил весь процесс.
      - name: Test failures
        if: failure()
        run: |
          RESULT="$RUNNER_TEMP/PackageTests.xcresult"
          [ -d "$RESULT" ] || { echo "Результатов тестов нет"; exit 0; }
          xcrun xcresulttool get test-results summary --path "$RESULT" --format json | python3 -c '
          import json, sys
          summary = json.load(sys.stdin)
          for failure in summary.get("testFailures", []):
              print("✘", failure.get("targetName", ""), failure.get("testName", ""))
              print("  ", failure.get("failureText", "").replace("\n", "\n   "))
          ' || true
          xcrun xcresulttool export diagnostics --path "$RESULT" --output-path "$RUNNER_TEMP/diagnostics" > /dev/null 2>&1 || true
          grep -rhIE -A4 "uncaught exception|Termination Reason|Library not loaded|Exception Type|Fatal error" \
            "$RUNNER_TEMP/diagnostics" 2>/dev/null | head -80 || true
